name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Kernel (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The geometry kernel is numpy-only on purpose, so the test suite needs
      # no display server, no OpenGL, and no VTK wheels. That is what keeps
      # this matrix fast and green on every platform.
      - name: Install kernel and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[accel,dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting drift
        run: python -m ruff format --check .
        continue-on-error: true

      - name: Test
        run: python -m pytest --cov --cov-report=term-missing

      - name: Assert the kernel stays GUI-free
        shell: python
        run: |
          import pathlib
          import sys

          banned = ("pyvista", "vtk", "PySide6", "pyvistaqt", "PyQt")
          offenders = []
          for path in pathlib.Path("src/kernel").rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              for line in text.splitlines():
                  stripped = line.strip()
                  if not stripped.startswith(("import ", "from ")):
                      continue
                  # Lazy imports inside functions are fine; only module level is banned.
                  if line[0].isspace():
                      continue
                  if any(name in stripped for name in banned):
                      offenders.append(f"{path}: {stripped}")
          if offenders:
              print("Kernel modules must not import GUI packages at module level:")
              print("\n".join(offenders))
              sys.exit(1)
          print("Kernel is GUI-free.")

  gui-smoke:
    name: GUI import smoke
    runs-on: ubuntu-latest
    # The desktop layer cannot be exercised headlessly in a meaningful way, but
    # importing it catches syntax errors and broken signal wiring early.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GUI dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 xvfb
          python -m pip install -e ".[gui,dev]"

      - name: Import the desktop layer under a virtual display
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a python -c "import src.ui.main_window; print('ui imports cleanly')"
